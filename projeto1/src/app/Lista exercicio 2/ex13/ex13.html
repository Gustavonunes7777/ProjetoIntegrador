<div class="container">
  <h3>Gerenciador de Tarefas</h3>

  <div class="resumo">
    <span>Total: <strong>{{ totalTarefas }}</strong></span> | 
    <span>Concluídas: <strong class="texto-sucesso">{{ totalConcluidas }}</strong></span> | 
    <span>Pendentes: <strong class="texto-alerta">{{ totalPendentes }}</strong></span>
  </div>

  <p *ngIf="tarefas.length === 0" class="sem-tarefas">
    Nenhuma tarefa cadastrada.
  </p>

  <ul *ngIf="tarefas.length > 0" class="lista-tarefas">
    <li 
      *ngFor="let tarefa of tarefas" 
      [ngClass]="{
        'prioridade-baixa': tarefa.prioridade === 'baixa',
        'prioridade-media': tarefa.prioridade === 'media',
        'prioridade-alta': tarefa.prioridade === 'alta',
        'tarefa-concluida': tarefa.concluida
      }"
    >
      <div class="info-tarefa">
        <span class="titulo" [class.riscado]="tarefa.concluida">{{ tarefa.titulo }}</span>
        <span class="detalhes">Resp: {{ tarefa.responsavel }} | Prioridade: {{ tarefa.prioridade }}</span>
      </div>

      <div class="status-acao">
        <span class="badge" [ngClass]="tarefa.concluida ? 'badge-sucesso' : 'badge-pendente'">
          {{ tarefa.concluida ? 'Concluída' : 'Pendente' }}
        </span>
        <button (click)="alternarStatus(tarefa.id)">
          {{ tarefa.concluida ? 'Marcar Pendente' : 'Marcar Concluída' }}
        </button>
      </div>
    </li>
  </ul>
</div>
